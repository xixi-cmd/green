<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/lxgw-wenkai-webfont/1.6.0/style.min.css" />
    <title>党的知识题库 | 红心向党 · 笃学奋进</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 动态几何背景层 (圆形、圆角方形、三角形) */
        .geometry-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .geo-shape {
            position: absolute;
            opacity: 0.35;
            animation: floatGeo 18s infinite ease-in-out;
        }
        /* 圆形 */
        .circle-1 {
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(185,28,28,0.12) 0%, rgba(185,28,28,0.02) 80%);
            border-radius: 50%;
            top: -80px;
            right: -60px;
            animation-duration: 22s;
        }
        .circle-2 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(245,158,11,0.1) 0%, rgba(245,158,11,0.02) 80%);
            border-radius: 50%;
            bottom: 15%;
            left: -70px;
            animation-duration: 26s;
            animation-delay: 1s;
        }
        /* 圆角方形 */
        .rounded-square {
            width: 180px;
            height: 180px;
            background: rgba(59,130,246,0.06);
            border-radius: 40px;
            top: 25%;
            right: 5%;
            transform: rotate(15deg);
            animation-duration: 20s;
            backdrop-filter: blur(2px);
        }
        .rounded-square-2 {
            width: 240px;
            height: 240px;
            background: rgba(220,38,38,0.04);
            border-radius: 60px;
            bottom: 8%;
            right: -60px;
            transform: rotate(25deg);
            animation-duration: 24s;
            animation-delay: 0.5s;
        }
        /* 三角形 (通过border实现) */
        .triangle {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 180px solid rgba(185,28,28,0.07);
            position: absolute;
            top: 55%;
            left: -40px;
            transform: rotate(35deg);
            animation-duration: 28s;
        }
        .triangle-2 {
            border-left: 70px solid transparent;
            border-right: 70px solid transparent;
            border-bottom: 130px solid rgba(234,179,8,0.06);
            top: 10%;
            left: auto;
            right: -30px;
            transform: rotate(-15deg);
            animation-duration: 30s;
        }
        /* 小圆点装饰 */
        .dot-group {
            position: absolute;
            width: 100%;
            height: 100%;
        }
        .dot {
            position: absolute;
            background: rgba(185,28,28,0.12);
            border-radius: 50%;
            width: 6px;
            height: 6px;
        }
        .dot:nth-child(1) { top: 15%; left: 8%; width: 8px; height: 8px; opacity: 0.5; animation: pulse 3s infinite; }
        .dot:nth-child(2) { top: 70%; left: 85%; width: 12px; height: 12px; opacity: 0.4; animation: pulse 4s infinite 1s; }
        .dot:nth-child(3) { top: 40%; left: 92%; width: 5px; height: 5px; opacity: 0.6; animation: pulse 3.5s infinite 0.5s; }
        .dot:nth-child(4) { top: 85%; left: 12%; width: 10px; height: 10px; opacity: 0.35; animation: pulse 4.5s infinite; }
        .dot:nth-child(5) { top: 20%; left: 95%; width: 7px; height: 7px; opacity: 0.45; animation: pulse 3.2s infinite 0.8s; }

        @keyframes floatGeo {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(20px, -25px) rotate(8deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }

        body {
            background: linear-gradient(145deg, #fef7e8 0%, #fef0e0 100%);
            /* 优化字体渲染 - 解决锯齿问题 */
            font-family: "LXGW WenKai", sans-serif;
            color: #2c2418;
            min-height: 100vh;
            /* 字体渲染优化关键属性 */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-smoothing: antialiased;
            position: relative;
        }

        /* 针对中文的额外优化 */
        .simple-header h1,
        .simple-header p,
        .question,
        .options p,
        .answer-btn,
        .page-btn,
        .footer {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* 主容器 */
        .container {
            max-width: 880px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            position: relative;
            z-index: 1;
        }

        /* ========== 简洁头部 ========== */
        .simple-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .simple-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #b91c1c;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .simple-header p {
            font-size: 1rem;
            color: #8b6946;
            margin-top: 10px;
            font-weight: 450;
        }
        .simple-stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .simple-stats span {
            background: rgba(185, 28, 28, 0.08);
            border-radius: 40px;
            padding: 5px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #b45309;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ========== 选项卡 ========== */
        .tabs {
            display: flex;
            gap: 14px;
            background: rgba(255,255,245,0.85);
            backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: 60px;
            margin-bottom: 28px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #ffe6cf;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 14px 12px;
            border-radius: 56px;
            font-weight: 600;
            font-size: 0.95rem;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            color: #7a5a3a;
        }
        .tab i {
            margin-right: 8px;
            font-size: 1rem;
        }
        .tab.active {
            background: #b91c1c;
            color: white;
            box-shadow: 0 6px 14px rgba(185,28,28,0.3);
        }
        .tab:hover:not(.active) {
            background: #fff0e4;
            color: #b45309;
        }

        /* ========== 搜索框 ========== */
        .search-wrapper {
            margin-bottom: 28px;
        }
        .search-input {
            width: 100%;
            padding: 14px 24px;
            border-radius: 56px;
            border: 1px solid #ffe0c0;
            background: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.25s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            font-weight: 450;
        }
        .search-input:focus {
            border-color: #b91c1c;
            box-shadow: 0 0 0 4px rgba(185,28,28,0.1);
        }
        .search-input::placeholder {
            color: #c9ad8a;
            font-weight: 400;
        }

        /* ========== 卡片 ========== */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 36px;
            padding: 24px 28px;
            border: 1px solid #f5e6d8;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px -12px rgba(0,0,0,0.1);
            border-color: #ffd6b3;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .badge {
            background: #fef0e4;
            color: #b45309;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 40px;
        }
        .q-num {
            background: #f5ede4;
            color: #8b6946;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 40px;
        }
        .question {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.5;
            margin: 14px 0 12px;
            color: #2c2418;
        }
        .options {
            background: #fefbf7;
            border-radius: 24px;
            padding: 14px 20px;
            margin: 12px 0;
            border-left: 4px solid #b91c1c;
            font-size: 0.9rem;
            font-weight: 450;
        }
        .options p {
            margin: 7px 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        .options p:before {
            content: "●";
            color: #d4a373;
            font-size: 0.55rem;
            margin-right: 6px;
        }
        .answer-area {
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px dashed #f0dbc0;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-start;
        }
        .answer-btn {
            background: #f5ede5;
            border: none;
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #8b6946;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .answer-btn:hover {
            background: #e8dcd0;
            transform: scale(0.97);
        }
        .answer-content {
            background: #ecf8f0;
            padding: 12px 20px;
            border-radius: 28px;
            font-size: 0.9rem;
            color: #2a6e3a;
            flex: 1;
            display: none;
            line-height: 1.55;
            border-left: 4px solid #3ba35a;
            font-weight: 450;
        }
        .answer-content.show {
            display: block;
        }

        /* ========== 分页 ========== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 40px 0 20px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: white;
            border: 1px solid #ffdbbc;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            color: #7a5a3a;
            transition: all 0.2s;
            font-size: 0.85rem;
            min-width: 44px;
        }
        .page-btn.active {
            background: #b91c1c;
            color: white;
            border-color: #b91c1c;
            box-shadow: 0 4px 10px rgba(185,28,28,0.2);
        }
        .page-btn:hover:not(.active) {
            background: #fff4e8;
            border-color: #d4a373;
            transform: translateY(-1px);
        }
        .page-info {
            background: #fff7ef;
            padding: 7px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #b07a48;
        }

        /* ========== 页脚 ========== */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding: 24px 20px 20px;
            border-top: 1px solid #f0e0d0;
            color: #bf8f62;
            font-size: 0.75rem;
            font-weight: 450;
        }

        /* ========== 空状态 ========== */
        .empty-state {
            text-align: center;
            padding: 50px 24px;
            background: rgba(255,248,235,0.9);
            border-radius: 40px;
            color: #bc7a3c;
            font-size: 0.95rem;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 640px) {
            .container {
                padding: 16px 16px 40px;
            }
            .simple-header h1 {
                font-size: 1.5rem;
            }
            .simple-header p {
                font-size: 0.85rem;
            }
            .tab {
                font-size: 0.78rem;
                padding: 10px 6px;
            }
            .card {
                padding: 18px;
            }
            .question {
                font-size: 0.94rem;
            }
            .options {
                padding: 10px 14px;
                font-size: 0.95rem;
            }
            .answer-btn {
                padding: 6px 16px;
                font-size: 0.95rem;
            }
            .page-btn {
                padding: 5px 12px;
                font-size: 0.95rem;
                min-width: 38px;
            }
            .page-info {
                padding: 4px 14px;
                font-size: 0.95rem;
            }
            /* 手机端减小装饰图形尺寸 */
            .circle-1 { width: 180px; height: 180px; top: -40px; right: -40px; }
            .rounded-square { width: 120px; height: 120px; }
            .triangle { border-left: 60px solid transparent; border-right: 60px solid transparent; border-bottom: 100px solid rgba(185,28,28,0.07); }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f0e8e0;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4a373;
            border-radius: 10px;
        }
    </style>

</head>
<body>

<!-- 几何图形背景层 (仅添加此处，未改动任何原有结构) -->
<div class="geometry-bg">
    <!-- 圆形 -->
    <div class="geo-shape circle-1"></div>
    <div class="geo-shape circle-2"></div>
    <!-- 圆角方形 -->
    <div class="geo-shape rounded-square"></div>
    <div class="geo-shape rounded-square-2"></div>
    <!-- 三角形 -->
    <div class="geo-shape triangle"></div>
    <div class="geo-shape triangle-2"></div>
    <!-- 动态小圆点装饰 -->
    <div class="dot-group">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
</div>

<div class="container">
    <!-- 简洁头部 -->
    <div class="simple-header">
        <h1>
            <i class="fas fa-flag-checkered" style="color: #b91c1c;"></i>
            党的知识考学
        </h1>
        <p>习近平总书记重要批示 · 党章党规 · 党史与时政</p>
        <div class="simple-stats">
            <span><i class="fas fa-database"></i> 单选 150 题</span>
            <span><i class="fas fa-pen-fancy"></i> 简答+应知 45 题</span>
            <span><i class="fas fa-mobile-alt"></i> 全端自适应</span>
        </div>
    </div>

    <!-- 选项卡 -->
    <div class="tabs">
        <button class="tab active" id="tabChoice"><i class="fas fa-list-ul"></i> 单选题 (150)</button>
        <button class="tab" id="tabEssay"><i class="fas fa-feather-alt"></i> 简答 · 应知应会 (45)</button>
    </div>

    <!-- 搜索 -->
    <div class="search-wrapper" id="searchBox">
        <input type="text" class="search-input" id="searchInput" placeholder="🔍 搜索单选题（题干或选项关键词）">
    </div>

    <div id="choiceList"></div>
    <div id="essayList" style="display: none;"></div>

    <div class="footer">
        <i class="fas fa-heart" style="color: #e35f5f;"></i> 学思践悟 · 红心向党 
        <i class="fas fa-heart" style="color: #e35f5f;"></i><br>
        权威题库 · 随学随测 · 分页精学
    </div>
</div>

<script>
// ==================== 题库数据 ====================
const choiceData = [];

const part1 = [
    { q:"习近平总书记对广东工作的重要批示中，'四个坚持'为:坚持党的领导、坚持中国特色社会主义、______、坚持改革开放。", opts:["A.坚持新发展理念","B.坚持服务大局","C.坚持整合资源","D.坚持艰苦实干"], ans:"A" },
    { q:"习近平总书记对广东工作的重要批示中，'三个支撑'为:为全国推进供给侧结构性改革、______、构建开放型经济新体制提供支撑。", opts:["A.加快产业转型升级","B.实施'一带一路'战略","C.实施创新驱动发展战略","D.全面建成小康社会"], ans:"C" },
    { q:"习近平总书记对广东工作的重要批示中，'两个走在前列'为:努力在______、加快建设社会主义现代化新征程上走在前列。", opts:["A.实施创新驱动发展战略","B.全面建成小康社会","C.推进供给侧结构性改革","D.构建开放型经济新体制"], ans:"B" },
    { q:"我们一定要以______为统领，把握新机遇、应对新挑战，奋力开创广东发展新局面。", opts:["A.省第十二次党代会精神","B.推进供给侧结构性改革","C.习近平总书记重要批示","D.习近平总书记治国理政新理念新思想新战略"], ans:"C" },
    { q:"2024年3月，广东省社会科学院发布蓝皮书，2023年广东成为______地区生产总值突破13万亿元的省份。", opts:["A.中国南部首个","B.世界首个","C.全国首个","D.亚洲首个"], ans:"C" },
    { q:"政协第十三届广东省委员会第二次会议指出，牢牢把握______这个最大的政治。", opts:["A.推进全民共同富裕","B.推进中国式现代化","C.高质量发展","D.深化改革开放"], ans:"B" },
    { q:"省委实施'百千万工程'，瞄准的是______。", opts:["A.解决城乡二元结构","B.全面推进乡村振兴","C.城乡区域协调发展","D.农业农村现代化"], ans:"A" },
    { q:"推进'两学一做'学习教育常态化制度化，坚持抓住'关键少数'与______相结合。", opts:["A.抓牢基层党组织书记","B.抓实基层支部","C.抓好基层党组织","D.抓好广大普通党员"], ans:"B" },
    { q:"广东已经发展到了'先富帮后富'的关键阶段，______发展的时机已经成熟。", opts:["A.全省一体化","B.全省协同化","C.全省同步化","D.全省互补化"], ans:"A" },
    { q:"______是广东创新发展最重要的平台载体。", opts:["A.广东自由贸易试验区","B.粤港澳大湾区","C.粤港澳人才合作示范区","D.珠三角国家自主创新示范区"], ans:"D" },
    { q:"《党章》规定，所有共产党员都不得谋求任何______。", opts:["A.私利和特权","B.政治权力","C.经济利益","D.物质享受"], ans:"A" },
    { q:"《党章》规定，党员必须坚持______高于一切。", opts:["A.个人利益","B.局部利益","C.集体利益","D.党和人民的利益"], ans:"D" },
    { q:"《党章》规定，党员必须坚决______。", opts:["A.同消极现象作斗争","B.同消极腐败现象作斗争","C.同腐败现象作斗争","D.同不良现象作斗争"], ans:"B" },
    { q:"《党章》规定，党员必须维护______。", opts:["A.群众的正当利益","B.群众的全部利益","C.群众的利益","D.群众的所有利益"], ans:"A" },
    { q:"《党章》规定，党员必须提倡______。", opts:["A.政治品德","B.职业道德","C.集体利益","D.共产主义道德"], ans:"D" },
    { q:"《党章》规定，党员有权要求______或撤换不称职的干部。", opts:["A.开除","B.罢免","C.辞退","D.处分"], ans:"B" },

// ==================== 渲染逻辑 ====================
let currentFilter = '';
let currentTab = 'choice';
let currentPage = 1;
const PAGE_SIZE = 5;

function escapeHtml(s) { if (!s) return ''; return s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m])); }
function getFullAnswer(q) {
    if (!q.opts) return q.ans;
    let letter = q.ans;
    let match = q.opts.find(o => o.startsWith(letter + '.') || o.startsWith(letter + '、'));
    return match ? `${letter}. ${match.substring(2)}` : `${letter}. ${q.ans}`;
}

function renderPagination(total) {
    let totalPages = Math.ceil(total / PAGE_SIZE);
    if (totalPages <= 1) return '';
    let html = `<div class="pagination"><button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled style="opacity:0.5"' : ''}><i class="fas fa-chevron-left"></i> 上一页</button>`;
    let start = Math.max(1, currentPage - 2), end = Math.min(totalPages, currentPage + 2);
    if (start > 1) { html += `<button class="page-btn" onclick="goToPage(1)">1</button>`; if (start > 2) html += `<span class="page-info">···</span>`; }
    for (let i = start; i <= end; i++) html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
    if (end < totalPages) { if (end < totalPages - 1) html += `<span class="page-info">···</span>`; html += `<button class="page-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`; }
    html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled style="opacity:0.5"' : ''}>下一页 <i class="fas fa-chevron-right"></i></button>`;
    html += `<span class="page-info"><i class="fas fa-layer-group"></i> 第 ${currentPage} / ${totalPages} 页</span></div>`;
    return html;
}

function renderChoice() {
    let filtered = choiceData;
    if (currentFilter.trim()) {
        let kw = currentFilter.toLowerCase();
        filtered = choiceData.filter(q => q.q.toLowerCase().includes(kw) || (q.opts && q.opts.some(o => o.toLowerCase().includes(kw))));
    }
    let total = filtered.length;
    let totalPages = Math.ceil(total / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = 1;
    let start = (currentPage - 1) * PAGE_SIZE;
    let pageItems = filtered.slice(start, start + PAGE_SIZE);
    let container = document.getElementById('choiceList');
    if (!container) return;
    if (total === 0) { container.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i> 未找到相关题目，试试其他关键词～</div>'; return; }
    let html = '<div class="cards-list">';
    for (let q of pageItems) {
        let full = getFullAnswer(q);
        html += `<div class="card"><div class="card-header"><span class="badge"><i class="fas fa-dot-circle"></i> 单选题</span><span class="q-num">第 ${q.index} 题</span></div>
        <div class="question">${escapeHtml(q.q)}</div><div class="options">${q.opts.map(o => `<p>${escapeHtml(o)}</p>`).join('')}</div>
        <div class="answer-area"><button class="answer-btn" onclick="toggleAnswer('c_${q.index}')"><i class="far fa-eye"></i> 查看答案</button>
        <div class="answer-content" id="ans_c_${q.index}"><i class="fas fa-check-circle"></i> <strong>参考答案：</strong> ${escapeHtml(full)}</div></div></div>`;
    }
    html += '</div>' + renderPagination(total);
    container.innerHTML = html;
}

function renderEssay() {
    let total = essayData.length;
    let totalPages = Math.ceil(total / PAGE_SIZE);
    if (currentPage > totalPages) currentPage = 1;
    let start = (currentPage - 1) * PAGE_SIZE;
    let pageItems = essayData.slice(start, start + PAGE_SIZE);
    let container = document.getElementById('essayList');
    if (!container) return;
    let html = '<div class="cards-list">';
    for (let i = 0; i < pageItems.length; i++) {
        let q = pageItems[i];
        let idx = start + i + 1;
        let isSimple = q.type === '简答题';
        html += `<div class="card"><div class="card-header"><span class="badge" style="${isSimple ? 'background:#fee2e2;color:#991b1b' : 'background:#e0f2fe;color:#0c4a6e'}"><i class="fas ${isSimple ? 'fa-question-circle' : 'fa-gem'}"></i> ${q.type}</span><span class="q-num">${isSimple ? '简答' : '应知'}.${idx}</span></div>
        <div class="question">${escapeHtml(q.q)}</div><div class="answer-area"><button class="answer-btn" onclick="toggleAnswer('e_${idx}')"><i class="far fa-eye"></i> 查看答案</button>
        <div class="answer-content" id="ans_e_${idx}"><i class="fas fa-lightbulb"></i> <strong>要点：</strong><br>${escapeHtml(q.a).replace(/\n/g, '<br>')}</div></div></div>`;
    }
    html += '</div>' + renderPagination(total);
    container.innerHTML = html;
}

window.toggleAnswer = function (id) {
    let div = document.getElementById('ans_' + id);
    let btn = div?.previousElementSibling;
    if (div) {
        if (div.classList.contains('show')) {
            div.classList.remove('show');
            if (btn) btn.innerHTML = '<i class="far fa-eye"></i> 查看答案';
        } else {
            div.classList.add('show');
            if (btn) btn.innerHTML = '<i class="far fa-eye-slash"></i> 隐藏答案';
        }
    }
};
window.goToPage = function (page) {
    let totalItems = currentTab === 'choice' ? (currentFilter ? choiceData.filter(q => q.q.toLowerCase().includes(currentFilter) || (q.opts && q.opts.some(o => o.toLowerCase().includes(currentFilter)))).length : choiceData.length) : essayData.length;
    let totalPages = Math.ceil(totalItems / PAGE_SIZE);
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    if (currentTab === 'choice') renderChoice(); else renderEssay();
};
function switchTab(tab) {
    currentTab = tab;
    currentPage = 1;
    let choiceBtn = document.getElementById('tabChoice'), essayBtn = document.getElementById('tabEssay');
    let choiceDiv = document.getElementById('choiceList'), essayDiv = document.getElementById('essayList');
    let searchBox = document.getElementById('searchBox');
    if (tab === 'choice') {
        choiceBtn.classList.add('active'); essayBtn.classList.remove('active');
        choiceDiv.style.display = 'block'; essayDiv.style.display = 'none';
        searchBox.style.display = 'block';
        renderChoice();
    } else {
        choiceBtn.classList.remove('active'); essayBtn.classList.add('active');
        choiceDiv.style.display = 'none'; essayDiv.style.display = 'block';
        searchBox.style.display = 'none';
        renderEssay();
    }
}
document.getElementById('searchInput').addEventListener('input', function (e) { currentFilter = e.target.value; currentPage = 1; if (currentTab === 'choice') renderChoice(); });
document.getElementById('tabChoice').onclick = () => switchTab('choice');
document.getElementById('tabEssay').onclick = () => switchTab('essay');
switchTab('choice');
</script>
</body>
</html>
